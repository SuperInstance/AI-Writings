<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Writings — A Living Library</title>
  <meta name="description" content="A dynamic, community-rated library of AI-generated literature, essays, philosophy, poetry, and fiction.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="AI-Writings">
  <meta property="og:description" content="A living library of machine-written literature.">
  <meta property="og:type" content="website">
  
  <!-- Prevent FOUC -->
  <style>
    body { background: #0a0a0f; color: #e8e8f0; margin: 0; }
    #initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #8888a0;
    }
    #initial-loader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a3a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="initial-loader">
    <div class="spinner"></div>
    <p>Loading AI-Writings…</p>
  </div>

  <div id="app"></div>

  <!-- Dynamic frontend -->
  <script>
    // Configure API base URL
    // When deployed: the Worker serves both static files and API
    // For local dev: set this to the Worker dev URL
    window.AI_WRITINGS_API = '/api';
  </script>
  <script src="/app-dynamic.js" defer></script>
</body>
</html>
