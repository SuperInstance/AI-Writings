body {

.header {

}

  letter-spacing: 2px;
  text-shadow: 0 0 30px rgba(232,196,104,0.3);
}
.header .subtitle {
  color: #6b7a90;
  font-style: italic;
  margin-top: 8px;
  font-size: 0.95em;
}
.legend {
  display: flex;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  padding: 16px;
  margin-bottom: 10px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82em;
  color: #8899aa;
  font-family: monospace;
}
.legend-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
}
.dot-creative { background: #e8a04e; }
.dot-radio { background: #5eba6e; }
.dot-arch { background: #4e9ee8; }
.dot-present { background: #b07ee8; }

.graph-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
svg.graph {
  width: 100%;
  height: 800px;
  display: block;
}
.node {
  cursor: pointer;
  transition: all 0.2s ease;
}
.node circle {
  transition: all 0.2s ease;
  stroke-width: 2;
}
.node:hover circle {
  stroke-width: 3;
  filter: brightness(1.3);
}
.node text {
  fill: #c8d3e0;
  font-family: 'Georgia', serif;
  font-size: 11px;
  text-anchor: middle;
  pointer-events: none;
  opacity: 0.85;
}
.node:hover text {
  opacity: 1;
  fill: #fff;
}
.edge {
  stroke: rgba(100,140,180,0.2);
  stroke-width: 1;
  fill: none;
  transition: all 0.2s ease;
}
.edge.highlight {
  stroke: rgba(232,196,104,0.5);
  stroke-width: 1.5;
}
.node.active circle {
  filter: brightness(1.5) drop-shadow(0 0 8px currentColor);
}
.node.active text { opacity: 1; fill: #fff; }

.info-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(10,14,20,0.96);
  border-top: 1px solid rgba(232,196,104,0.3);
  padding: 16px 24px;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 100;
}
.info-panel.show { transform: translateY(0); }
.info-panel h3 {
  color: #e8c468;
  margin-bottom: 6px;
  font-weight: normal;
}
.info-panel .type-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.72em;
  font-family: monospace;
  margin-left: 8px;
  vertical-align: middle;
}
.info-panel .connections {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.info-panel .conn-link {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(232,196,104,0.1);
  border: 1px solid rgba(232,196,104,0.2);
  border-radius: 4px;
  color: #a8c0d8;
  text-decoration: none;
  font-size: 0.82em;
  transition: all 0.15s;
}
.info-panel .conn-link:hover {
  background: rgba(232,196,104,0.2);
  color: #e8c468;
}
.info-panel .open-link {
  display: inline-block;
  margin-top: 8px;
  color: #e8c468;
  text-decoration: none;
  font-size: 0.88em;
  border-bottom: 1px dotted #e8c468;
}

.info-panel .close-btn {

  top: 12px;
  right: 16px;
  background: none;
  border: none;
  color: #6b7a90;
  font-size: 1.4em;
  cursor: pointer;
}

.footer-note {

  padding: 30px 20px 80px;
  color: #4a5a70;
  font-size: 0.82em;

  radio: '#5eba6e',
  arch: '#4e9ee8',
  present: '#b07ee8'
};
const typeLabels = {
  creative: 'CREATIVE',
  radio: 'RADIO',
  arch: 'ARCHITECTURE',
  present: 'PRESENTATION'
};

document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', () => {
    const id = node.dataset.id;
    const title = node.dataset.title;
    const desc = node.dataset.desc;
    const url = node.dataset.url;
    const type = node.dataset.type;
    const links = JSON.parse(node.dataset.links || '[]');

    // Build path prefix for relative URLs
    const basePath = '';

    document.getElementById('panelTitle').textContent = title;
    const badge = document.getElementById('panelBadge');
    badge.textContent = typeLabels[type] || type.toUpperCase();
    badge.style.background = typeColors[type] + '22';
    badge.style.color = typeColors[type];
    badge.style.border = '1px solid ' + typeColors[type] + '44';

    document.getElementById('panelDesc').textContent = desc;

    const linksContainer = document.getElementById('panelLinks');
    linksContainer.innerHTML = '';
    links.forEach(l => {
      const a = document.createElement('a');
      a.className = 'conn-link';
      a.href = basePath + l.url;
      a.textContent = '→ ' + l.label;
      linksContainer.appendChild(a);
    });

    const openLink = document.getElementById('panelOpen');
    openLink.href = basePath + url;

    document.getElementById('infoPanel').classList.add('show');

    // Highlight active node and connected edges
    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    node.classList.add('active');
  });

  // Highlight on hover
  node.addEventListener('mouseenter', () => {
    document.querySelectorAll('.edge').forEach(e => e.classList.remove('highlight'));
    const id = node.dataset.id;
    // Could add edge highlighting logic here
  });
});

function closePanel() {
  document.getElementById('infoPanel').classList.remove('show');
  document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
}
</script>

<script src="/assets/fleet-media.js" defer></script>
</body>
</html>
