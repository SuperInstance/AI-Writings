name: corpus-guard

# The AI-Writings repository is a precious record of the agents' creative output.
# A branch can be replaced wholesale by a force-push from an agent that
# re-bootstrapped after a sandbox wipe, and the only reliable alarm is the
# CONTENT itself.
#
# This job measures CONTENT, not paths. A reorganisation moves 20,000 files and
# deletes 1,197 paths, and none of the writing is lost - the bytes are all still
# here. A path-based guard cannot tell that apart from a catastrophe, so it
# fired on the library build and would have blocked a deliberate, lossless
# reorganisation.
#
# The rule now: a blob that existed in the base commit must still exist in the
# new commit. Paths may move, may be renamed, may be collapsed onto a single
# address when the bytes are identical - but no distinct work may disappear.
#
# To remove a work ON PURPOSE, list its blob SHA in .corpus-guard-allowlist
# (one per line) in the same pull request. That makes the removal explicit and
# reviewable instead of invisible.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus-guard:
    name: corpus-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert no work was lost
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          export LC_ALL=C
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "no base commit available; nothing to compare"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true

          git ls-tree -r --format='%(objectname)' "$BASE" | sort -u > /tmp/before.txt
          git ls-tree -r --format='%(objectname)' HEAD      | sort -u > /tmp/after.txt

          # Deliberately-removed work, declared by the author of the change.
          : > /tmp/allowed.txt
          if [ -f .corpus-guard-allowlist ]; then
            # grep exits 1 when it selects nothing, and GitHub runs this step
            # with `bash -e`, so a bare grep here would abort the whole step.
            { grep -vE '^[[:space:]]*(#|$)' .corpus-guard-allowlist || true; } \
              | tr -d ' \t\r' | sort -u > /tmp/allowed.txt
          fi

          # Set difference by whole line. comm is not used on purpose: it exits 1
          # on unsorted input, and with `bash -e` that would fail the step for a
          # reason that has nothing to do with the corpus.
          grep -F -x -v -f /tmp/after.txt /tmp/before.txt > /tmp/lost_raw.txt || true
          grep -F -x -v -f /tmp/allowed.txt /tmp/lost_raw.txt > /tmp/lost.txt || true

          BEFORE=$(wc -l < /tmp/before.txt | tr -d ' ')
          AFTER=$(wc -l < /tmp/after.txt | tr -d ' ')
          LOST=$(wc -l < /tmp/lost.txt | tr -d ' ')
          ALLOWED=$(comm -23 /tmp/lost_raw.txt /tmp/lost.txt | wc -l | tr -d ' ')

          PATHS_BEFORE=$(git ls-tree -r --name-only "$BASE" | wc -l | tr -d ' ')
          PATHS_AFTER=$(git ls-tree -r --name-only HEAD      | wc -l | tr -d ' ')

          echo "content before=$BEFORE after=$AFTER lost=$LOST (declared removals: $ALLOWED)"
          echo "paths   before=$PATHS_BEFORE after=$PATHS_AFTER"

          if [ "$LOST" -gt 0 ]; then
            echo "::error::corpus guard: $LOST distinct work(s) would be lost. This repository is a record - removals must be deliberate and declared in .corpus-guard-allowlist."
            echo "--- lost content (blob sha) ---"
            head -50 /tmp/lost.txt
            exit 1
          fi

          echo "corpus guard: OK - every distinct work in the base commit is still present."
