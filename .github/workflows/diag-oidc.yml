name: diag-oidc
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Mint and inspect OIDC
        run: |
          echo "ID_TOKEN_REQUEST_URL=[$ACTIONS_ID_TOKEN_REQUEST_URL]"
          echo "has_request_token=[${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}]"
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}" || true)
          echo "raw_mint_len=${#T}"
          echo "raw_mint_head=${T:0:200}"
          V=$(echo "$T" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))" 2>/dev/null || true)
          echo "token_len=${#V}"
          echo "$V" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || echo "$V" | cut -d. -f2 | python3 -c "import sys,base64;s=sys.stdin.read().strip();print(base64.urlsafe_b64decode(s+'='*(-len(s)%4)).decode())"
          echo "--- with audience=vault ---"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | head -c 300
          echo
      - name: Probe vault with body
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "--- proxy POST full body ---"
          curl -s -i -X POST "https://superinstance-vault.casey-digennaro.workers.dev/proxy" \
            -H "Content-Type: application/json" \
            -H "User-Agent: purplepincher-zero/1.0 (+https://github.com/purplepincher/zero)" \
            -d "{\"oidc_token\":\"$OIDC_TOKEN\",\"service\":\"llm\",\"action\":\"complete\",\"params\":{\"model\":\"MiniMax-M1\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK.\"}],\"max_tokens\":20}}" | head -40
          echo "--- root/other endpoints ---"
          for p in "" "proxy" "status" "models" "openai/v1/models"; do
            echo -n "/$p -> "; curl -s -o /dev/null -w "%{http_code}\n" "https://superinstance-vault.casey-digennaro.workers.dev/$p"
          done
