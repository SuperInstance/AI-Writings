name: Generate Landing Page

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate landing page
        run: python tools/generate-landing.py

      - name: Commit generated files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html index.json
          if git diff --cached --quiet; then
            echo "no generated changes to publish"
            exit 0
          fi
          git commit -m "🔄 Auto-update landing page index"
          # main is protected (PR review required, admins enforced, no force-push).
          # Publish the regenerated index as a reviewable PR instead of pushing
          # to main directly.
          BRANCH="automation/landing-page"
          git push --force-with-lease origin "HEAD:$BRANCH" || git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "🔄 Auto-update landing page index" \
            --body "Regenerated by the Generate Landing Page workflow. \`main\` is protected, so this lands as a reviewable PR (one approving review required)."

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
