<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Demo — The Reef</title>
<meta name="description" content="The live digital-twin-shell. Connects over WebSocket; renders a 3D scene with the boat, kintsugi seams, and CoCapn agent.">
<style>
:root {
  --bg: #06090c;
  --surface: #0d1217;
  --border: #1a2128;
  --text: #e0e0e0;
  --text-dim: #8a96a3;
  --gold: #f0b14a;
  --green: #00ff88;
  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans)}
a{color:var(--gold);text-decoration:none}
a:hover{color:#ffc66e;text-decoration:underline}

.bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(6,9,12,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;z-index:1000;font-size:.85rem}
.bar .left{display:flex;align-items:center;gap:1rem}
.bar .left .logo{font-family:var(--mono);font-weight:700;color:var(--gold)}
.bar .left .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(0,255,136,0.6);display:inline-block;margin-right:.5rem;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.bar .left .name{color:var(--text-dim)}
.bar .left .name b{color:var(--text)}
.bar .right{display:flex;align-items:center;gap:1rem;font-family:var(--mono);font-size:.78rem}
.bar .right a{color:var(--text-dim)}
.bar .right a:hover{color:var(--gold);text-decoration:none}
.bar .right .state{display:flex;align-items:center;gap:.4rem;color:var(--text-dim)}
.bar .right .state .led{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px rgba(0,255,136,0.6);animation:pulse 2s ease-in-out infinite}
.bar .right .state .led.off{background:#a04030;box-shadow:0 0 5px rgba(255,80,80,0.4);animation:none}

.shell{position:fixed;top:48px;left:0;right:0;bottom:0;background:#000}
.shell iframe{width:100%;height:100%;border:0;display:block}
.shell .fallback{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-family:var(--mono);font-size:.85rem;text-align:center;padding:2rem;flex-direction:column;gap:1rem}
.shell .fallback b{color:var(--text);font-size:1.05rem}
.shell .fallback .code{background:#0a0e12;border:1px solid var(--border);border-radius:6px;padding:1rem 1.25rem;font-size:.8rem;line-height:1.7;max-width:560px;width:100%;text-align:left}
.shell .fallback .code .c{color:#5a6470}
.shell .fallback .code .k{color:#6cd0e0}
.shell .fallback .code .s{color:var(--gold)}
</style>
</head>
<body>

<div class="bar">
  <div class="left">
    <a href="index.html" class="logo"><span class="dot"></span>the reef</a>
    <span class="name">· <b>Live Demo</b></span>
  </div>
  <div class="right">
    <span class="state" id="state"><span class="led"></span> <span id="state-text">connecting…</span></span>
    <span>·</span>
    <a href="https://github.com/SuperInstance/digital-twin-shell" target="_blank" rel="noopener">source ↗</a>
    <span>·</span>
    <a href="index.html">back to landing</a>
  </div>
</div>

<div class="shell">
  <iframe
    id="shell-frame"
    src="../digital-twin-shell/index.html?port=29500"
    title="Digital twin shell"></iframe>
  <noscript>
    <div class="fallback">
      <b>JavaScript is required</b>
      <p>The live shell is a Three.js scene driven by a WebSocket stream.</p>
    </div>
  </noscript>
</div>

<script>
// Watch the iframe's contentWindow to surface the live shell's connection state.
const frame = document.getElementById('shell-frame');
const stateText = document.getElementById('state-text');
const stateEl = document.getElementById('state');
const led = stateEl.querySelector('.led');

function setState(s) {
  if (!s) return;
  stateText.textContent = s.text || 'connected';
  if (s.state === 'LIVE') {
    led.classList.remove('off');
  } else if (s.state === 'OFFLINE' || s.state === 'BACKOFF') {
    led.classList.add('off');
  } else {
    led.classList.remove('off');
  }
}

// Poll the iframe's exposed global. The shell exposes
//   window.__digitalTwin.getConnState()
//   window.__digitalTwin.getFrameCount()
setInterval(() => {
  try {
    const w = frame.contentWindow;
    if (!w || !w.__digitalTwin) return;
    const state = w.__digitalTwin.getConnState();
    const frames = w.__digitalTwin.getFrameCount();
    setState({ state, text: `${state.toLowerCase()} · ${frames} frames` });
  } catch (e) {
    // cross-origin — silent
  }
}, 1000);

// Detect if the iframe failed to load (file not found)
frame.addEventListener('error', () => {
  stateText.textContent = 'shell not found';
  led.classList.add('off');
});
</script>

<script src="/assets/fleet-media.js" defer></script>
</body>
</html>
