<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Quilt Classroom — Mobile/Touch Edition</title>
<style>
:root{--bg:#0a0a14;--panel:#1a1a2a;--panel-2:#2a2a3a;--fg:#e8e0d0;--accent:#e8b840;--cell:#44cc88;--link:#88aaff;--pink:#ff80c0;--red:#ff6666}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}
header{padding:1rem;background:var(--panel);border-bottom:2px solid var(--accent);position:sticky;top:env(safe-area-inset-top);z-index:10}
h1{color:var(--accent);margin:0;font-size:1.3em}
.tagline{color:#888;font-style:italic;margin:0.3rem 0;font-size:0.85em}
.container{padding:0.8rem}
.tabs{display:flex;gap:0.5rem;margin-bottom:0.7rem}
.tabs button{background:var(--panel-2);color:var(--fg);border:1px solid var(--panel-2);padding:0.7rem 1rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:1em;min-height:48px;flex:1}
.tabs button.active{background:var(--accent);color:#000;border-color:var(--accent)}
.panel{background:var(--panel);border-radius:8px;padding:1rem;margin-bottom:0.7rem}
button{background:var(--accent);color:#000;border:none;padding:0.9rem 1.2rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:1em;min-height:48px;font-family:inherit;touch-action:manipulation}
button:active{filter:brightness(1.2)}
button.secondary{background:var(--panel-2);color:var(--fg)}
button.pink{background:var(--pink)}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--panel-2);border-radius:4px;padding:0.7rem;font-size:1em;min-height:48px;width:100%;box-sizing:border-box;font-family:inherit;margin-bottom:0.5rem}
textarea{min-height:80px}
.student-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.5rem;margin-top:0.7rem}
.student-card{background:var(--panel-2);border-radius:6px;padding:0.7rem;border-left:3px solid var(--link)}
.student-card.disconnected{border-left-color:var(--red);opacity:0.6}
.student-name{font-weight:bold;font-size:1em;color:var(--link)}
.student-cell-count{color:var(--cell);font-family:monospace;font-size:1.3em;margin-top:0.3rem}

.classroom-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:0.7rem;touch-action:manipulation}
.cell-slot{aspect-ratio:1;background:var(--bg);border:2px solid var(--panel-2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.85em;color:#888;font-weight:bold;min-height:50px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:rgba(232,184,64,0.3)}
.cell-slot:active{transform:scale(0.95);border-color:var(--accent)}
.cell-slot.bound{background:var(--cell);color:#000;border-color:var(--cell)}
.cell-slot.linked{background:var(--link);color:#000;border-color:var(--link)}
.witness-log{background:var(--bg);border:1px solid var(--panel-2);border-radius:4px;padding:0.5rem;font-family:monospace;font-size:0.7em;height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:0.5rem}
.witness-line{padding:1px 0;word-break:break-all}
.witness-line.BIND{color:var(--cell)}
.witness-line.LINK{color:var(--link)}
.witness-line.TICK{color:#aa88ff}

.feedback{background:#0d1117;border:1px solid var(--panel-2);border-radius:4px;padding:0.7rem;margin-top:0.5rem;font-size:0.85em}

@media(min-width:768px){body{padding:1.5rem}.container{max-width:1200px;margin:0 auto}.classroom-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>

<header>
<h1>🎓 Quilt Classroom</h1>
<p class="tagline">One lattice. Teacher + students, live.</p>
</header>

<div class="container">

<div class="tabs">
<button id="btnTeacher" onclick="setRole('teacher')" class="active">👩‍🏫 Teacher</button>
<button id="btnStudent" onclick="setRole('student')">🎒 Student</button>
</div>

<div id="teacherView">
<div class="panel">
<h2>Class Setup</h2>
<input type="text" id="teacherName" placeholder="Teacher name">
<input type="text" id="className" placeholder="Class name">
<div id="rosterCode"></div>
<h2 style="margin-top:1rem">Students</h2>
<div id="studentList" class="student-list"></div>
</div>
<div class="panel">
<h2>New Assignment</h2>
<input type="text" id="assignmentTitle" placeholder="Assignment title">
<textarea id="assignmentPrompt" placeholder="What students should do..."></textarea>
<button onclick="createAssignment()" style="width:100%">📢 Send</button>
</div>
</div>

<div id="studentView" style="display:none">
<div class="panel">
<h2>Join Class</h2>
<input type="text" id="joinCode" placeholder="Class code">
<input type="text" id="studentName" placeholder="Your name">
<button onclick="joinClass()" style="width:100%">🎒 Join</button>
</div>
<div class="panel" id="studentWorkspace" style="display:none">
<h2>Your Lattice</h2>
<p style="font-size:0.85em;color:#888">Tap cells to bind. Teacher sees in real time.</p>
<div class="classroom-grid" id="classroomGrid"></div>
<h2 style="margin-top:1rem">Witness Log</h2>
<div id="studentLog" class="witness-log"></div>
<h2 style="margin-top:1rem">Assignment</h2>
<div id="studentAssignment" class="feedback"></div>
</div>
</div>

</div>

<script>
let role = 'teacher';
let classCode = '';
let students = {};
let assignments = [];
let cellState = {};
let crossDeviceChannel = null;

if (typeof BroadcastChannel !== 'undefined') {
  crossDeviceChannel = new BroadcastChannel('quilt-classroom');
  crossDeviceChannel.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'student_join') {
      students[msg.name] = { ...msg.info, joinedAt: Date.now() };
      renderStudents();
    } else if (msg.type === 'student_bind') {
      students[msg.student] = students[msg.student] || { name: msg.student };
      students[msg.student].cellCount = msg.cellCount;
      students[msg.student].lastUpdate = Date.now();
      renderStudents();
    } else if (msg.type === 'assignment_post') {
      assignments.push(msg.assignment);
      renderAssignments();
    }
  };
}

function setRole(r) {
  role = r;
  document.getElementById('teacherView').style.display = r === 'teacher' ? '' : 'none';
  document.getElementById('studentView').style.display = r === 'student' ? '' : 'none';
  document.getElementById('btnTeacher').className = r === 'teacher' ? 'active' : '';
  document.getElementById('btnStudent').className = r === 'student' ? 'active' : '';
}

function generateCode() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }

function createClassroom() {
  const tn = document.getElementById('teacherName').value.trim() || 'Teacher';
  const cn = document.getElementById('className').value.trim() || 'Class';
  classCode = generateCode();
  document.getElementById('rosterCode').innerHTML = `
    <div style="background:var(--panel-2);padding:0.8rem;border-radius:6px;margin-top:0.5rem;text-align:center">
      <div style="color:#888;font-size:0.85em">Share this code with students</div>
      <div style="font-family:monospace;font-size:1.8em;color:var(--accent);font-weight:bold;letter-spacing:0.2em;margin-top:0.3rem">${classCode}</div>
    </div>
  `;
  save();
}

function joinClass() {
  const sn = document.getElementById('studentName').value.trim();
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (!sn || !code) return alert('Need name and code!');
  classCode = code;
  document.getElementById('studentWorkspace').style.display = '';
  initStudentGrid();
  crossDeviceChannel.postMessage({ type: 'student_join', name: sn, info: { cellCount: 0 } });
}

function initStudentGrid() {
  const grid = document.getElementById('classroomGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const slot = document.createElement('div');
    slot.className = 'cell-slot';
    slot.dataset.idx = i;
    slot.textContent = (i+1).toString();
    slot.tabIndex = 0;
    slot.setAttribute('role', 'button');
    // Touch + click handled uniformly
    slot.onclick = () => studentBind(i);
    grid.appendChild(slot);
  }
}

function studentBind(idx) {
  const slot = document.querySelector(`.cell-slot[data-idx="${idx}"]`);
  cellState[idx] = (cellState[idx] || 0) + 1;
  slot.classList.toggle('bound', cellState[idx] % 2 === 1);
  slot.textContent = cellState[idx] % 2 === 1 ? `B${cellState[idx]}` : (idx+1).toString();
  const log = document.getElementById('studentLog');
  const line = document.createElement('div');
  line.className = 'witness-line BIND';
  line.textContent = `[t=${cellState[idx]}] BIND c${idx + 1}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 100) log.removeChild(log.firstChild);
  crossDeviceChannel.postMessage({
    type: 'student_bind',
    student: document.getElementById('studentName').value.trim(),
    cellCount: Object.keys(cellState).length
  });
}

function createAssignment() {
  if (!classCode) createClassroom();
  const title = document.getElementById('assignmentTitle').value.trim();
  const prompt = document.getElementById('assignmentPrompt').value.trim();
  if (!title || !prompt) return alert('Need title and prompt');
  const a = { id: Date.now(), title, prompt, postedAt: Date.now() };
  assignments.push(a);
  crossDeviceChannel.postMessage({ type: 'assignment_post', assignment: a });
  renderAssignments();
  document.getElementById('assignmentTitle').value = '';
  document.getElementById('assignmentPrompt').value = '';
}

function renderAssignments() {
  const c = document.getElementById('studentAssignment');
  if (assignments.length === 0) {
    c.innerHTML = '<span style="color:#888">No assignment yet</span>';
    return;
  }
  const latest = assignments[assignments.length - 1];
  c.innerHTML = `<strong>${latest.title}</strong><br>${latest.prompt}`;
}

function renderStudents() {
  const list = document.getElementById('studentList');
  list.innerHTML = '';
  if (Object.keys(students).length === 0) {
    list.innerHTML = '<p style="color:#888;font-size:0.85em">Waiting for students…</p>';
    return;
  }
  for (const [name, info] of Object.entries(students)) {
    const card = document.createElement('div');
    card.className = 'student-card';
    const age = Date.now() - (info.lastUpdate || info.joinedAt || Date.now());
    if (age > 60000) card.classList.add('disconnected');
    card.innerHTML = `
      <div class="student-name">${name}</div>
      <div style="color:#888;font-size:0.75em">${age < 60000 ? 'Active' : 'Idle'}</div>
      <div class="student-cell-count">${info.cellCount || 0}</div>
    `;
    list.appendChild(card);
  }
}

function save() {
  if (classCode) localStorage.setItem(`quilt-class-${classCode}`, JSON.stringify({ students, assignments }));
}

setInterval(() => { renderStudents(); }, 5000);

// Keyboard nav for cell slots
document.addEventListener('keydown', e => {
  const focused = document.activeElement;
  if (focused && focused.classList && focused.classList.contains('cell-slot')) {
    let idx = parseInt(focused.dataset.idx);
    let next = idx;
    if (e.key === 'ArrowRight') next = Math.min(idx+1, 24);
    if (e.key === 'ArrowLeft') next = Math.max(idx-1, 0);
    if (e.key === 'ArrowDown') next = Math.min(idx+5, 24);
    if (e.key === 'ArrowUp') next = Math.max(idx-5, 0);
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focused.click(); return; }
    if (next !== idx) {
      e.preventDefault();
      document.querySelector(`.cell-slot[data-idx="${next}"]`).focus();
    }
  }
});
</script>

</body>
</html>
