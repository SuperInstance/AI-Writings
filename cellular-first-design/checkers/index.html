<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substrate Checkers — cosine-eval AI</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#131a2b;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--accent3:#7c5cff;--amber:#ffb84d;--warn:#ff6b6b;--mono:'SF Mono',monospace;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:1.5rem;min-height:100vh;background:radial-gradient(ellipse at top,#1a2a1a 0%,#06080f 70%)}
header{max-width:1100px;margin:0 auto 1.5rem;text-align:center}
h1{color:var(--accent);font-size:1.6rem;margin:0 0 .3rem}
.tagline{color:var(--dim);font-size:.95rem}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:480px;margin:0 auto;border:2px solid var(--accent);border-radius:4px;overflow:hidden;aspect-ratio:1}
.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;position:relative;user-select:none}
.square.light{background:#e8d4a8}
.square.dark{background:#8b6e4e}
.square.selected{box-shadow:inset 0 0 0 4px var(--accent)}
.square.valid::after{content:'';position:absolute;width:30%;height:30%;background:rgba(0,255,157,0.4);border-radius:50%;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.3);opacity:1}}
.piece{filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));font-weight:bold}
.piece.red{color:#d00}
.piece.black{color:#222}
.piece.king::after{content:'♔';position:absolute;top:-8px;right:-8px;font-size:1.2rem;color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;height:fit-content}
button{display:block;width:100%;background:var(--accent);color:#000;border:none;padding:.6rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:.85rem;margin-bottom:.4rem}
button:hover{background:#3dffb7}
button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.stats{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:.5rem;font-family:var(--mono);font-size:.75rem;color:var(--text2)}
.stats div{margin-bottom:.2rem}
.stats .v{color:var(--accent);font-weight:bold}
.log{max-height:140px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.5rem;margin-top:.5rem;font-family:var(--mono);font-size:.7rem;color:var(--dim)}
.log .ok{color:var(--accent)}
.log .capture{color:var(--warn)}
footer{max-width:1100px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>🟥 Substrate Checkers</h1>
<p class="tagline">Cosine-similarity AI. Each piece has a 16-d vector. Each square has a 16-d vector. Eval = cosine(piece, square).</p>
</header>

<main>
<div>
<div class="board" id="board"></div>
</div>
<aside class="panel">
<button onclick="newGame()">↻ New game</button>
<button class="secondary" onclick="aiMove()">🤖 AI move</button>
<button class="secondary" onclick="undo()">↶ Undo</button>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .5rem">Eval</h3>
<div class="stats">
<div>Turn: <span class="v" id="turn">red</span></div>
<div>Eval: <span class="v" id="eval">0.0</span></div>
<div>Pieces: <span class="v" id="pieces">24</span></div>
<div>Moves: <span class="v" id="moves">0</span></div>
<div>State hash: <span class="v" id="hash" style="font-size:.6rem;word-break:break-all">—</span></div>
</div>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .5rem">Log</h3>
<div class="log" id="log"></div>
</aside>
</main>

<footer>🟥 substrate checkers · <a href="../math-layer.html">math-layer</a></footer>

<script>
// Substrate math
class Xoshiro256 {
  constructor(seed) {
    const h = fnv1a64(new TextEncoder().encode(seed));
    this.state = new BigUint64Array(4);
    for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, h + BigInt(i) * 0x9e3779b97f4a7c15n);
  }
  next() {
    const s = this.state;
    const result = BigInt.asUintN(64, (BigInt.asUintN(64, s[1] * 5n) << 7n | BigInt.asUintN(64, s[1] * 5n) >> 57n) * 9n);
    const t = s[1] << 17n;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t;
    s[3] = BigInt.asUintN(64, (s[3] << 45n | s[3] >> 19n));
    return result;
  }
  float() { return Number(this.next() & 0xffffffffn) / (1 << 32); }
  intRange(min, max) { return Math.floor(this.float() * (max - min)) + min; }
}
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < bytes.length; i++) h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * 0x100000001b3n);
  return h;
}
function cosine(a, b) {
  let dot = 0, mA = 0, mB = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; mA += a[i]*a[i]; mB += b[i]*b[i]; }
  return dot / (Math.sqrt(mA) * Math.sqrt(mB) + 1e-10);
}

let board = Array(64).fill(null);
let turn = 'r';
let selected = null;
let validMoves = [];
let moves = 0;
let rng = new Xoshiro256('checkers-' + Date.now());

function pieceVec(p, idx) {
  const v = new Float32Array(16);
  const seed = 'p-' + p.color + (p.king ? 'k' : '') + '-' + idx;
  const h = fnv1a64(new TextEncoder().encode(seed));
  for (let i = 0; i < 16; i++) {
    const bits = Number((h >> BigInt(i * 4)) & 0xfn);
    v[i] = (bits - 7.5) / 7.5;
  }
  return v;
}
function squareVec(file, rank) {
  const v = new Float32Array(16);
  for (let i = 0; i < 16; i++) {
    if (i < 8) v[i] = (Math.sin((file * 8 + rank) * 0.1 + i) * 0.5);
    else v[i] = (Math.cos((file - rank) * 0.2 + i) * 0.5);
  }
  return v;
}

function setupBoard() {
  board = Array(64).fill(null);
  for (let i = 0; i < 64; i++) {
    const file = i % 8, rank = Math.floor(i / 8);
    if ((file + rank) % 2 === 1) {
      if (rank < 3) board[i] = { color: 'b', king: false };
      else if (rank > 4) board[i] = { color: 'r', king: false };
    }
  }
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let i = 0; i < 64; i++) {
    const file = i % 8, rank = Math.floor(i / 8);
    const sq = document.createElement('div');
    sq.className = 'square ' + ((file + rank) % 2 === 0 ? 'light' : 'dark');
    if (selected === i) sq.classList.add('selected');
    if (validMoves.includes(i)) sq.classList.add('valid');
    const p = board[i];
    if (p) {
      const div = document.createElement('div');
      div.className = 'piece ' + p.color + (p.king ? ' king' : '');
      div.textContent = '●';
      sq.appendChild(div);
    }
    sq.addEventListener('click', () => handleClick(i));
    el.appendChild(sq);
  }
  // Eval
  let ev = 0;
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (!p) continue;
    const sq = squareVec(i % 8, Math.floor(i / 8));
    const pv = pieceVec(p, i);
    const c = cosine(pv, sq);
    // Position bonus: red wants low rank, black wants high rank
    const rank = Math.floor(i / 8);
    const posBonus = p.color === 'r' ? (rank - 3.5) * 0.1 : (3.5 - rank) * 0.1;
    const kingBonus = p.king ? 0.3 : 0;
    ev += (p.color === 'r' ? 1 : -1) * (c + posBonus + kingBonus);
  }
  document.getElementById('eval').textContent = ev.toFixed(2);
  document.getElementById('turn').textContent = turn === 'r' ? 'red' : 'black';
  document.getElementById('pieces').textContent = board.filter(p => p).length;
  document.getElementById('moves').textContent = moves;
  document.getElementById('hash').textContent = '0x' + fnv1a64(new TextEncoder().encode(board.map(p => p ? (p.color + (p.king ? 'k' : '')) : '-').join(','))).toString(16).padStart(16, '0');
}

function getMoves(idx) {
  const p = board[idx];
  if (!p) return [];
  const moves = [];
  const directions = p.king ? [-1, 1] : (p.color === 'r' ? [1] : [-1]);
  for (const dy of directions) {
    for (const dx of [-1, 1]) {
      const newRank = Math.floor(idx / 8) + dy;
      const newFile = (idx % 8) + dx;
      if (newFile < 0 || newFile >= 8 || newRank < 0 || newRank >= 8) continue;
      const newIdx = newRank * 8 + newFile;
      if (!board[newIdx]) moves.push(newIdx);
      else if (board[newIdx].color !== p.color) {
        // Try to capture
        const capRank = newRank + dy;
        const capFile = newFile + dx;
        if (capFile < 0 || capFile >= 8 || capRank < 0 || capRank >= 8) continue;
        const capIdx = capRank * 8 + capFile;
        if (!board[capIdx]) moves.push({ jump: true, to: capIdx, over: newIdx });
      }
    }
  }
  return moves;
}

function handleClick(idx) {
  const p = board[idx];
  if (selected !== null) {
    // Try to move
    const valid = validMoves.find(m => (typeof m === 'object' ? m.to : m) === idx);
    if (valid !== undefined) {
      if (typeof valid === 'object') {
        board[selected] = null;
        board[valid.over] = null;
        board[valid.to] = p;
      } else {
        board[selected] = null;
        board[valid] = p;
      }
      // King promotion
      const newRank = Math.floor(idx / 8);
      if ((p.color === 'r' && newRank === 7) || (p.color === 'b' && newRank === 0)) p.king = true;
      selected = null;
      validMoves = [];
      turn = turn === 'r' ? 'b' : 'r';
      moves++;
      log('Move ' + moves, 'ok');
      render();
      return;
    }
  }
  if (p && p.color === turn) {
    selected = idx;
    const ms = getMoves(idx);
    validMoves = ms.map(m => typeof m === 'object' ? m.to : m);
    render();
  } else {
    selected = null;
    validMoves = [];
    render();
  }
}

function aiMove() {
  // Find best move via cosine eval
  let bestScore = -Infinity;
  let bestMove = null;
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (!p || p.color !== turn) continue;
    const ms = getMoves(i);
    for (const m of ms) {
      const isJump = typeof m === 'object';
      const toIdx = isJump ? m.to : m;
      // Simulate
      const oldTo = board[toIdx];
      const oldOver = isJump ? board[m.over] : null;
      board[toIdx] = p;
      board[i] = null;
      if (isJump) board[m.over] = null;
      // Eval
      let ev = 0;
      for (let j = 0; j < 64; j++) {
        const pp = board[j];
        if (!pp) continue;
        const sq = squareVec(j % 8, Math.floor(j / 8));
        const pv = pieceVec(pp, j);
        const c = cosine(pv, sq);
        const r = Math.floor(j / 8);
        const posBonus = pp.color === 'r' ? (r - 3.5) * 0.1 : (3.5 - r) * 0.1;
        ev += (pp.color === 'r' ? 1 : -1) * (c + posBonus);
      }
      if (turn === 'b') ev = -ev;
      if (ev > bestScore) { bestScore = ev; bestMove = { from: i, m }; }
      // Restore
      board[i] = p;
      board[toIdx] = oldTo;
      if (isJump) board[m.over] = oldOver;
    }
  }
  if (bestMove) {
    const p = board[bestMove.from];
    const m = bestMove.m;
    const isJump = typeof m === 'object';
    const toIdx = isJump ? m.to : m;
    board[toIdx] = p;
    board[bestMove.from] = null;
    if (isJump) {
      board[m.over] = null;
      log('AI captured!', 'capture');
    }
    const newRank = Math.floor(toIdx / 8);
    if ((p.color === 'r' && newRank === 7) || (p.color === 'b' && newRank === 0)) p.king = true;
    turn = turn === 'r' ? 'b' : 'r';
    moves++;
    render();
  }
}

function newGame() {
  setupBoard();
  turn = 'r';
  selected = null;
  validMoves = [];
  moves = 0;
  rng = new Xoshiro256('checkers-' + Date.now());
  render();
}

function undo() {
  // Simple: just restart
  newGame();
  log('Game reset', '');
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  el.insertBefore(div, el.firstChild);
  while (el.children.length > 20) el.removeChild(el.lastChild);
}

newGame();
</script>
</body>
</html>
