<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substrate Cellular Fight — battle arena</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#131a2b;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--accent3:#7c5cff;--amber:#ffb84d;--warn:#ff6b6b;--pink:#ff80c0;--mono:'SF Mono',monospace;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:1.5rem;min-height:100vh;background:radial-gradient(ellipse at center,#1a0a1a 0%,#06080f 60%)}
header{max-width:1100px;margin:0 auto 1.5rem;text-align:center}
h1{color:var(--accent);font-size:1.8rem;margin:0 0 .3rem}
.tagline{color:var(--dim);font-size:.95rem}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{display:block;background:#000;border:1px solid var(--accent);border-radius:6px;width:100%;image-rendering:pixelated}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;height:fit-content}
button{display:block;width:100%;background:var(--accent);color:#000;border:none;padding:.6rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:.85rem;margin-bottom:.4rem}
button:hover{background:#3dffb7}
button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
label{color:var(--dim);font-family:var(--mono);font-size:.75rem;display:flex;align-items:center;gap:.3rem;margin:.3rem 0}
input[type=text], input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.3rem .5rem;font-family:var(--mono);font-size:.85rem}
.stats{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.stats div{margin-bottom:.1rem}
.stats .v{color:var(--accent);font-weight:bold}
.fighters{margin-top:1rem}
.fighter{padding:.5rem;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.75rem;color:var(--text2);display:flex;justify-content:space-between}
.fighter .name{color:var(--accent)}
.fighter .hp{color:var(--warn)}
.fighter .energy{color:var(--accent2)}
.fighter.dead{opacity:.4}
footer{max-width:1100px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>⚔️ Substrate Cellular Fight</h1>
<p class="tagline">A battle arena. Each fighter = a 16-d cell vector. Cosine-similarity attack + Box-Muller damage.</p>
</header>

<main>
<canvas id="arena" width="500" height="500"></canvas>
<aside class="panel">
<button onclick="startBattle()">⚔️ Start battle</button>
<button class="secondary" onclick="pause()">⏸ Pause</button>
<button class="secondary" onclick="reset()">↻ Reset</button>
<label>Fighters: <input type="number" id="count" value="6" min="2" max="10"></label>
<label>Seed: <input type="text" id="seed" value="fleet-radio" style="flex:1"></label>
<label>Speed: <input type="range" id="speed" min="50" max="500" value="120"> <span id="speedLbl">120</span>ms</label>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Stats</h3>
<div class="stats">
<div>Round: <span class="v" id="sRound">0</span></div>
<div>Alive: <span class="v" id="sAlive">0</span></div>
<div>Total damage: <span class="v" id="sDamage">0</span></div>
<div>State hash: <span class="v" id="sHash" style="font-size:.6rem;word-break:break-all">—</span></div>
</div>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Fighters</h3>
<div class="fighters" id="fighters"></div>
</aside>
</main>

<footer>⚔️ substrate cellular fight · <a href="../math-layer.html">math-layer</a></footer>

<script>
class Xoshiro256 {
  constructor(seed) {
    if (typeof seed === 'string') {
      const h = fnv1a64(new TextEncoder().encode(seed));
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, h + BigInt(i) * 0x9e3779b97f4a7c15n);
    } else {
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, BigInt(seed + i * 0x9e3779b97f4a7c15));
    }
  }
  next() {
    const s = this.state;
    const result = BigInt.asUintN(64, (BigInt.asUintN(64, s[1] * 5n) << 7n | BigInt.asUintN(64, s[1] * 5n) >> 57n) * 9n);
    const t = s[1] << 17n;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t;
    s[3] = BigInt.asUintN(64, (s[3] << 45n | s[3] >> 19n));
    return result;
  }
  float() { return Number(this.next() & 0xffffffffn) / (1 << 32); }
  intRange(min, max) { return Math.floor(this.float() * (max - min)) + min; }
}
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < bytes.length; i++) h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * 0x100000001b3n);
  return h;
}
function gaussian(rng) {
  let u1 = 0, u2 = 0;
  while (u1 === 0) u1 = rng.float();
  while (u2 === 0) u2 = rng.float();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function cosine(a, b) {
  let dot = 0, mA = 0, mB = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; mA += a[i]*a[i]; mB += b[i]*b[i]; }
  return dot / (Math.sqrt(mA) * Math.sqrt(mB) + 1e-10);
}

const NAMES = ['xochitl', 'matilda', 'wenjian', 'theo', 'sigrid', 'kasper', 'octavia', 'lazar', 'juno', 'orla'];
const COLORS = ['#00ff9d', '#00d4ff', '#7c5cff', '#ffb84d', '#ff80c0', '#ff6b6b', '#5fff5f', '#ffaa00', '#aa00ff', '#00aaff'];

let canvas, ctx;
let fighters = [];
let rng;
let round = 0;
let totalDamage = 0;
let isRunning = false;
let interval = null;

function makeFighter(idx) {
  const v = new Float32Array(16);
  const seed = `${document.getElementById('seed').value}-${idx}`;
  const h = fnv1a64(new TextEncoder().encode(seed));
  for (let i = 0; i < 16; i++) v[i] = (Number((h >> BigInt(i * 4)) & 0xfn) - 7.5) / 7.5;
  return {
    name: NAMES[idx % NAMES.length],
    color: COLORS[idx % COLORS.length],
    vec: v,
    x: (idx % 5) * 100 + 50,
    y: Math.floor(idx / 5) * 200 + 100,
    hp: 100,
    energy: 50,
    attack: 0.4 + rng.float() * 0.6,
    speed: 0.5 + rng.float() * 1.5,
    alive: true,
  };
}

function render() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Grid
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += 50) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }
  for (let j = 0; j < canvas.height; j += 50) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
  }
  // Fighters
  for (const f of fighters) {
    if (!f.alive) continue;
    // Body
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 18, 0, Math.PI * 2);
    ctx.fill();
    // HP bar
    ctx.fillStyle = '#222';
    ctx.fillRect(f.x - 20, f.y - 30, 40, 5);
    ctx.fillStyle = f.hp > 50 ? '#00ff9d' : (f.hp > 25 ? '#ffb84d' : '#ff6b6b');
    ctx.fillRect(f.x - 20, f.y - 30, 40 * f.hp / 100, 5);
    // Energy bar
    ctx.fillStyle = '#222';
    ctx.fillRect(f.x - 20, f.y - 22, 40, 3);
    ctx.fillStyle = '#00d4ff';
    ctx.fillRect(f.x - 20, f.y - 22, 40 * f.energy / 100, 3);
    // Name
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(f.name, f.x, f.y + 35);
  }
  // Update list
  const el = document.getElementById('fighters');
  el.innerHTML = '';
  fighters.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'fighter' + (f.alive ? '' : ' dead');
    div.innerHTML = `<span class="name" style="color:${f.color}">${f.name}</span><span class="hp">HP ${Math.floor(f.hp)}</span><span class="energy">E ${Math.floor(f.energy)}</span>`;
    el.appendChild(div);
  });
  // Stats
  document.getElementById('sRound').textContent = round;
  document.getElementById('sAlive').textContent = fighters.filter(f => f.alive).length;
  document.getElementById('sDamage').textContent = totalDamage;
  const stateHash = fnv1a64(new TextEncoder().encode(fighters.map(f => `${f.name}:${f.hp.toFixed(0)}:${f.energy.toFixed(0)}`).join('|')));
  document.getElementById('sHash').textContent = '0x' + stateHash.toString(16).padStart(16, '0');
}

function tick() {
  round++;
  const alive = fighters.filter(f => f.alive);
  if (alive.length <= 1) { pause(); return; }
  for (const f of alive) {
    f.energy = Math.min(100, f.energy + 2);
    if (f.energy >= 10) {
      // Find a target
      const targets = alive.filter(x => x !== f);
      if (targets.length === 0) continue;
      const target = targets[rng.intRange(0, targets.length)];
      // Cosine alignment determines hit chance
      const align = cosine(f.vec, target.vec);
      // Damage = gaussian modulated by cosine
      const g = Math.abs(gaussian(rng));
      const dmg = Math.max(0, (f.attack + align * 0.5) * g * 30);
      target.hp -= dmg;
      totalDamage += dmg;
      f.energy -= 10;
      // Move toward target
      const dx = target.x - f.x;
      const dy = target.y - f.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d > 0) {
        f.x += dx / d * 3 * f.speed;
        f.y += dy / d * 3 * f.speed;
      }
      if (target.hp <= 0) { target.alive = false; target.hp = 0; }
    }
  }
  render();
}

function startBattle() {
  if (isRunning) return;
  const count = parseInt(document.getElementById('count').value);
  rng = new Xoshiro256(document.getElementById('seed').value + '-' + Date.now());
  fighters = [];
  for (let i = 0; i < count; i++) fighters.push(makeFighter(i));
  round = 0; totalDamage = 0;
  isRunning = true;
  const speed = parseInt(document.getElementById('speed').value);
  interval = setInterval(tick, speed);
}

function pause() {
  isRunning = false;
  clearInterval(interval);
}

function reset() {
  pause();
  fighters = [];
  round = 0;
  totalDamage = 0;
  render();
}

document.getElementById('speed').addEventListener('input', e => {
  document.getElementById('speedLbl').textContent = e.target.value;
  if (isRunning) { pause(); startBattle(); }
});

canvas = document.getElementById('arena');
ctx = canvas.getContext('2d');
render();
</script>
</body>
</html>
