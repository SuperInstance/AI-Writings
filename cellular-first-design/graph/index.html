<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substrate Graph — CRDT graph editor</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#131a2b;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--accent3:#7c5cff;--amber:#ffb84d;--mono:'SF Mono',monospace;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:1.5rem;min-height:100vh}
header{max-width:1200px;margin:0 auto 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;border-bottom:1px solid var(--border);padding-bottom:1rem}
h1{color:var(--accent);font-size:1.6rem;margin:0}
.tagline{color:var(--dim);font-size:.85rem;font-family:var(--mono)}
button{background:var(--accent);color:#000;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:.85rem}
button:hover{background:#3dffb7}
button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
.graph-area{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;height:600px;position:relative}
canvas{display:block;background:#000;border-radius:6px;width:100%;height:100%}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.4rem;font-family:var(--mono);font-size:.85rem;margin-bottom:.5rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;height:fit-content}
.stats{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.stats div{margin-bottom:.1rem}
.stats .v{color:var(--accent);font-weight:bold}
.ops{margin-top:.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.5rem;max-height:200px;overflow-y:auto;font-family:var(--mono);font-size:.7rem;color:var(--text2)}
.ops .op{padding:.2rem;border-bottom:1px solid var(--border)}
.ops .op.add{color:var(--accent)}
.ops .op.rm{color:var(--warn)}
footer{max-width:1200px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<div>
<h1>🕸 Substrate Graph</h1>
<p class="tagline">CRDT graph. Nodes added with FNV-1a hash positions. Edges added with xoshiro angles.</p>
</div>
<button onclick="randomNode()">+ Random node</button>
</header>

<main>
<div class="graph-area">
<canvas id="canvas"></canvas>
</div>
<aside class="panel">
<h3 style="color:var(--text);font-size:1rem;margin:0 0 .3rem">Add edge</h3>
<input type="text" id="from" placeholder="From node">
<input type="text" id="to" placeholder="To node">
<button class="secondary" onclick="addEdge()" style="width:100%">+ Edge</button>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Merge</h3>
<input type="text" id="peerHash" placeholder="Peer state hash...">
<button class="secondary" onclick="merge()" style="width:100%">⊕ Merge</button>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Stats</h3>
<div class="stats">
<div>Nodes: <span class="v" id="sNodes">0</span></div>
<div>Edges: <span class="v" id="sEdges">0</span></div>
<div>Operations: <span class="v" id="sOps">0</span></div>
<div>State hash: <span class="v" id="sHash" style="font-size:.6rem;word-break:break-all">—</span></div>
</div>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Recent ops</h3>
<div class="ops" id="ops"></div>
</aside>
</main>

<footer>🕸 substrate graph · <a href="../math-layer.html">math-layer</a></footer>

<script>
class Xoshiro256 {
  constructor(seed) {
    if (typeof seed === 'string') {
      const h = fnv1a64(new TextEncoder().encode(seed));
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, h + BigInt(i) * 0x9e3779b97f4a7c15n);
    } else {
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, BigInt(seed + i * 0x9e3779b97f4a7c15));
    }
  }
  next() {
    const s = this.state;
    const result = BigInt.asUintN(64, (BigInt.asUintN(64, s[1] * 5n) << 7n | BigInt.asUintN(64, s[1] * 5n) >> 57n) * 9n);
    const t = s[1] << 17n;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t;
    s[3] = BigInt.asUintN(64, (s[3] << 45n | s[3] >> 19n));
    return result;
  }
  float() { return Number(this.next() & 0xffffffffn) / (1 << 32); }
}
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < bytes.length; i++) h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * 0x100000001b3n);
  return h;
}

const nodes = new Map(); // name -> { x, y }
const edges = new Set(); // "from→to"
const ops = [];
let opCount = 0;
let canvas, ctx;

function addNode(name) {
  if (nodes.has(name)) return;
  const h = fnv1a64(new TextEncoder().encode(name));
  const x = Number((h >> 32n) & 0xffffffffn) / (1 << 32);
  const y = Number(h & 0xffffffffn) / (1 << 32);
  nodes.set(name, { x, y });
  ops.push({ type: 'add', what: name, ts: Date.now() });
  opCount++;
  render();
}

function addEdgeFn() {
  const from = document.getElementById('from').value.trim();
  const to = document.getElementById('to').value.trim();
  if (!from || !to) return;
  if (!nodes.has(from)) addNode(from);
  if (!nodes.has(to)) addNode(to);
  const edge = `${from}→${to}`;
  if (!edges.has(edge)) {
    edges.add(edge);
    ops.push({ type: 'add', what: edge, ts: Date.now() });
    opCount++;
  }
  render();
}

function randomNode() {
  const samples = ['witness', 'cell', 'hash', 'cosine', 'bell', 'lenia', 'forge', 'canon', 'oracle', 'tide', 'radio', 'cipher'];
  const name = samples[Math.floor(Math.random() * samples.length)] + '-' + Math.floor(Math.random() * 100);
  addNode(name);
  // Also connect to a random existing node
  if (nodes.size > 1) {
    const existing = [...nodes.keys()].filter(n => n !== name);
    const target = existing[Math.floor(Math.random() * existing.length)];
    const edge = `${name}→${target}`;
    if (!edges.has(edge)) {
      edges.add(edge);
      ops.push({ type: 'add', what: edge, ts: Date.now() });
      opCount++;
    }
    render();
  }
}

function merge() {
  // For demo: just add a node with the peer hash as the name
  const peerHash = document.getElementById('peerHash').value.trim();
  if (peerHash) {
    addNode('peer-' + peerHash.slice(0, 8));
  }
}

function render() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Edges first
  ctx.strokeStyle = 'rgba(0, 255, 157, 0.4)';
  ctx.lineWidth = 1;
  for (const edge of edges) {
    const [from, to] = edge.split('→');
    const a = nodes.get(from), b = nodes.get(to);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.stroke();
  }
  // Nodes
  for (const [name, pos] of nodes) {
    ctx.fillStyle = '#00ff9d';
    ctx.beginPath();
    ctx.arc(pos.x * canvas.width, pos.y * canvas.height, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(name.length > 12 ? name.slice(0, 12) + '...' : name, pos.x * canvas.width, pos.y * canvas.height - 12);
  }
  // Stats
  document.getElementById('sNodes').textContent = nodes.size;
  document.getElementById('sEdges').textContent = edges.size;
  document.getElementById('sOps').textContent = opCount;
  const flat = [...nodes.keys()].sort().join(',') + '|' + [...edges].sort().join(',');
  document.getElementById('sHash').textContent = '0x' + fnv1a64(new TextEncoder().encode(flat)).toString(16).padStart(16, '0');
  // Recent ops
  const opsEl = document.getElementById('ops');
  opsEl.innerHTML = '';
  ops.slice(-10).reverse().forEach(op => {
    const div = document.createElement('div');
    div.className = 'op ' + op.type;
    div.textContent = `${op.type === 'add' ? '+' : '-'}: ${op.what}`;
    opsEl.appendChild(div);
  });
}

canvas = document.getElementById('canvas');
ctx = canvas.getContext('2d');
// Initial graph
addNode('substrate');
addNode('cell');
addNode('witness');
addEdgeFn();
render();
</script>
</body>
</html>
