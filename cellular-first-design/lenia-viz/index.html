<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lenia — Continuous Cellular Automata</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--mono:'SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;padding:1.5rem;min-height:100vh}
header{max-width:900px;margin:0 auto 1.5rem}
h1{color:var(--accent);font-size:1.5rem;margin:0 0 .3rem}
main{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{background:#000;border:1px solid var(--border);border-radius:8px;width:100%;height:500px;display:block;image-rendering:pixelated}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;height:fit-content}
button{display:block;width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:.6rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;margin-bottom:.4rem;text-align:left}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:bold;text-align:center}
.controls label{color:var(--dim);font-size:.8rem;font-family:var(--mono);display:block;margin-bottom:.3rem}
input[type=number],input[type=range]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.3rem;font-family:var(--mono);font-size:.8rem;width:100%;margin-bottom:.5rem}
.stats{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:1rem;font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.stats div{margin-bottom:.2rem}
.stats .v{color:var(--accent);font-weight:bold}
footer{max-width:900px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>🌊 Lenia — Continuous Life</h1>
<p class="tagline">Smooth Conway. Continuous values, bell-shaped kernel, growth function. Watch the glider.</p>
</header>
<main>
<canvas id="c" width="500" height="500"></canvas>
<aside class="panel">
<div class="controls">
<label>μ (growth mean): <input type="number" id="mu" value="0.15" step="0.01" min="0.05" max="0.3"></label>
<label>σ (growth width): <input type="number" id="sigma" value="0.015" step="0.001" min="0.005" max="0.05"></label>
<label>R (kernel radius): <input type="number" id="R" value="5" step="1" min="2" max="10"></label>
<label>Δt (time step): <input type="number" id="dt" value="0.1" step="0.05" min="0.05" max="0.5"></label>
</div>
<button class="primary" id="runBtn" onclick="toggleRun()">▶ Run</button>
<button onclick="step()">⏭ Step</button>
<button onclick="reseed()">↻ Reseed</button>
<h3 style="color:var(--dim);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin:1rem 0 .5rem">Preset params</h3>
<button onclick="preset('orbium')">Orbium (glider)</button>
<button onclick="preset('smoothlife')">Smooth life</button>
<button onclick="preset('bacteria')">Bacteria</button>
<h3 style="color:var(--dim);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin:1rem 0 .5rem">Stats</h3>
<div class="stats">
<div>step: <span class="v" id="sStep">0</span></div>
<div>density: <span class="v" id="sDen">—</span></div>
<div>max value: <span class="v" id="sMax">—</span></div>
<div>fps: <span class="v" id="sFps">—</span></div>
</div>
</aside>
</main>
<footer>🌊 substrate-game-engine Lenia · <a href="https://github.com/SuperInstance/substrate-game-engine">github.com/SuperInstance/substrate-game-engine</a></footer>
<script>
const W = 500, H = 500;
const N = 128;
let canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let field = new Float32Array(N * N);
let next = new Float32Array(N * N);
let stepN = 0;
let running = false;
let timer = null;
let frameCount = 0;
let lastFpsTime = 0;

// Bell kernel precomputed
const BETA = new Float32Array(200);
(function initBeta() {
  for (let r = 0; r <= 1; r += 0.005) {
    const idx = Math.round(r / 0.005);
    if (idx < 200) BETA[idx] = Math.exp(-Math.pow((r - 0.5) * 12, 2) / 2);
  }
})();

function bellBeta(r) {
  if (r < 0 || r > 1) return 0;
  const idx = Math.round(r / 0.005);
  return BETA[idx] || 0;
}

function step() {
  const mu = parseFloat(document.getElementById('mu').value);
  const sigma = parseFloat(document.getElementById('sigma').value);
  const R = parseInt(document.getElementById('R').value);
  const dt = parseFloat(document.getElementById('dt').value);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let sum = 0, weight = 0;
      for (let dy = -R; dy <= R; dy++) {
        for (let dx = -R; dx <= R; dx++) {
          const r = Math.sqrt(dx*dx + dy*dy) / R;
          if (r > 1) continue;
          const nx = ((x + dx) % N + N) % N;
          const ny = ((y + dy) % N + N) % N;
          const b = bellBeta(r);
          sum += field[ny * N + nx] * b;
          weight += b;
        }
      }
      const u = weight > 0 ? sum / weight : 0;
      const g = 2 * Math.exp(-Math.pow((u - mu) / sigma, 2) / 2) - 1;
      next[y * N + x] = Math.max(0, Math.min(1, field[y * N + x] + dt * g));
    }
  }
  [field, next] = [next, field];
  stepN++;
  render();
  updateStats();
}

function render() {
  const cellSize = W / N;
  const imgData = ctx.createImageData(W, H);
  let maxV = 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const v = field[y * N + x];
      if (v > maxV) maxV = v;
    }
  }
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const v = field[y * N + x];
      // Color: black → cyan → green → yellow
      const t = v;
      const r = Math.round(255 * Math.pow(t, 0.5) * 1.0);
      const g = Math.round(255 * Math.pow(t, 1.5));
      const b = Math.round(255 * (1 - t) * 0.5);
      // Render cell
      for (let py = 0; py < cellSize; py++) {
        for (let px = 0; px < cellSize; px++) {
          const ix = (y * cellSize + py) * W + (x * cellSize + px);
          imgData.data[ix * 4] = Math.min(255, r);
          imgData.data[ix * 4 + 1] = Math.min(255, g);
          imgData.data[ix * 4 + 2] = Math.min(255, b);
          imgData.data[ix * 4 + 3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function updateStats() {
  let sum = 0, maxV = 0;
  for (let i = 0; i < field.length; i++) {
    sum += field[i];
    if (field[i] > maxV) maxV = field[i];
  }
  document.getElementById('sStep').textContent = stepN;
  document.getElementById('sDen').textContent = (sum / field.length).toFixed(3);
  document.getElementById('sMax').textContent = maxV.toFixed(3);
}

function reseed() {
  field.fill(0);
  const cx = N/2, cy = N/2;
  const radius = 8;
  for (let y = cy-radius; y <= cy+radius; y++) {
    for (let x = cx-radius; x <= cx+radius; x++) {
      const dx = x-cx, dy = y-cy;
      if (dx*dx + dy*dy <= radius*radius) {
        field[((y%N+N)%N)*N + ((x%N+N)%N)] = 0.5;
      }
    }
  }
  stepN = 0;
  render();
}

function preset(name) {
  if (name === 'orbium') {
    document.getElementById('mu').value = 0.15;
    document.getElementById('sigma').value = 0.015;
    document.getElementById('R').value = 5;
  } else if (name === 'smoothlife') {
    document.getElementById('mu').value = 0.26;
    document.getElementById('sigma').value = 0.04;
    document.getElementById('R').value = 3;
  } else if (name === 'bacteria') {
    document.getElementById('mu').value = 0.30;
    document.getElementById('sigma').value = 0.06;
    document.getElementById('R').value = 7;
  }
  reseed();
}

function toggleRun() {
  running = !running;
  document.getElementById('runBtn').textContent = running ? '⏸ Pause' : '▶ Run';
  if (running) {
    lastFpsTime = performance.now();
    frameCount = 0;
    timer = setInterval(() => {
      step();
      frameCount++;
      if (frameCount % 10 === 0) {
        const now = performance.now();
        const fps = 10000 / (now - lastFpsTime);
        document.getElementById('sFps').textContent = fps.toFixed(1);
        lastFpsTime = now;
      }
    }, 50);
  } else {
    clearInterval(timer);
  }
}

reseed();
</script>
</body>
</html>
