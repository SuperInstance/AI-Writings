<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rule 110 — substrate-game-engine demo</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--mono:'SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;padding:1.5rem;min-height:100vh}
header{max-width:1100px;margin:0 auto 1.5rem}
h1{color:var(--accent);font-size:1.5rem;margin:0 0 .3rem}
.tagline{color:var(--dim);font-size:.9rem}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 280px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{background:#000;border:1px solid var(--border);border-radius:8px;width:100%;height:520px;display:block;image-rendering:pixelated}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;height:fit-content}
button{display:block;width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:.6rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;margin-bottom:.4rem;text-align:left;transition:all .15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:bold;text-align:center}
button.active{background:var(--accent2);color:#000;border-color:var(--accent2);font-weight:bold}
.controls{margin-bottom:.5rem}
.controls label{color:var(--dim);font-size:.8rem;font-family:var(--mono);display:block;margin-bottom:.3rem}
input[type=range]{width:100%}
.stats{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:1rem;font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.stats div{margin-bottom:.2rem}
.stats .v{color:var(--accent);font-weight:bold}
footer{max-width:1100px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>⚡ Rule 110 — Turing-Complete</h1>
<p class="tagline">1D cellular automaton with 8-bit rule. Step through generations or run continuously. Watch the structure emerge.</p>
</header>
<main>
<canvas id="c" width="600" height="520"></canvas>
<aside class="panel">
<div class="controls">
<label>Rule (0-255):
<input type="number" id="rule" value="110" min="0" max="255">
</label>
<label>Speed: <span id="speedLbl">50</span> ms/step
<input type="range" id="speed" min="0" max="500" value="50" step="10">
</label>
<label>Cell size: <span id="cellLbl">3</span>px
<input type="range" id="cellSize" min="1" max="8" value="3">
</label>
</div>
<button class="primary" id="runBtn" onclick="toggleRun()">▶ Run</button>
<button onclick="step()">⏭ Step</button>
<button onclick="reset()">↻ Reset</button>
<h3 style="color:var(--dim);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin:1rem 0 .5rem">Seed</h3>
<button onclick="seed('single')">Single cell</button>
<button onclick="seed('random')">Random 50%</button>
<button onclick="seed('pattern')">Custom pattern</button>
<h3 style="color:var(--dim);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin:1rem 0 .5rem">Stats</h3>
<div class="stats">
<div>rule: <span class="v" id="sRule">110</span></div>
<div>generation: <span class="v" id="sGen">0</span></div>
<div>population: <span class="v" id="sPop">—</span></div>
<div>density: <span class="v" id="sDen">—</span></div>
<div>width: <span class="v" id="sW">200</span></div>
</div>
</aside>
</main>
<footer>⚡ Rule 110 demo · <a href="https://github.com/SuperInstance/substrate-game-engine">github.com/SuperInstance/substrate-game-engine</a></footer>
<script>
let canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
const W = 600, H = 520;
let line = new Uint8Array(200);
let nextLine = new Uint8Array(200);
let gen = 0;
let running = false;
let ruleNum = 110;
let ruleTable = new Uint8Array(8);
let speed = 50;
let cellSize = 3;
let timer = null;

function buildRule(n) {
  ruleTable = new Uint8Array(8);
  for (let i = 0; i < 8; i++) ruleTable[i] = (n >> i) & 1;
}

function step() {
  for (let i = 0; i < line.length; i++) {
    const l = line[(i - 1 + line.length) % line.length];
    const c = line[i];
    const r = line[(i + 1) % line.length];
    const idx = (l << 2) | (c << 1) | r;
    nextLine[i] = ruleTable[idx];
  }
  // Render this row
  ctx.fillStyle = '#000'; ctx.fillRect(0, H - cellSize - 1, W, cellSize);
  for (let i = 0; i < line.length; i++) {
    ctx.fillStyle = line[i] ? '#00ff9d' : '#000';
    ctx.fillRect(i * cellSize, H - cellSize, cellSize, cellSize);
  }
  // Shift line down
  const imgData = ctx.getImageData(0, 0, W, H - cellSize);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.putImageData(imgData, 0, cellSize);
  // Render new row at bottom
  for (let i = 0; i < nextLine.length; i++) {
    ctx.fillStyle = nextLine[i] ? '#00ff9d' : '#000';
    ctx.fillRect(i * cellSize, H - cellSize, cellSize, cellSize);
  }
  [line, nextLine] = [nextLine, line];
  gen++;
  updateStats();
}

function updateStats() {
  let pop = 0;
  for (let i = 0; i < line.length; i++) pop += line[i];
  document.getElementById('sRule').textContent = ruleNum;
  document.getElementById('sGen').textContent = gen;
  document.getElementById('sPop').textContent = pop;
  document.getElementById('sDen').textContent = (pop / line.length).toFixed(3);
  document.getElementById('sW').textContent = line.length;
}

function toggleRun() {
  running = !running;
  document.getElementById('runBtn').textContent = running ? '⏸ Pause' : '▶ Run';
  if (running) {
    timer = setInterval(step, speed);
  } else {
    clearInterval(timer);
  }
}

function reset() {
  if (timer) clearInterval(timer);
  running = false;
  document.getElementById('runBtn').textContent = '▶ Run';
  gen = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  seed(currentSeed);
}

let currentSeed = 'single';
function seed(kind) {
  currentSeed = kind;
  line.fill(0);
  if (kind === 'single') line[Math.floor(line.length / 2)] = 1;
  else if (kind === 'random') for (let i = 0; i < line.length; i++) line[i] = Math.random() < 0.5 ? 1 : 0;
  else if (kind === 'pattern') {
    // Try every interesting rule 110 starting pattern
    line[Math.floor(line.length / 2)] = 1;
    line[Math.floor(line.length / 2) + 2] = 1;
    line[Math.floor(line.length / 2) - 1] = 1;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // Render first line at top
  for (let i = 0; i < line.length; i++) {
    ctx.fillStyle = line[i] ? '#00ff9d' : '#000';
    ctx.fillRect(i * cellSize, 0, cellSize, cellSize);
  }
  gen = 0;
  updateStats();
}

document.getElementById('rule').addEventListener('input', e => {
  ruleNum = parseInt(e.target.value);
  buildRule(ruleNum);
  reset();
});

document.getElementById('speed').addEventListener('input', e => {
  speed = 510 - parseInt(e.target.value);
  document.getElementById('speedLbl').textContent = (510 - parseInt(e.target.value));
  if (running) { clearInterval(timer); timer = setInterval(step, speed); }
});

document.getElementById('cellSize').addEventListener('input', e => {
  cellSize = parseInt(e.target.value);
  document.getElementById('cellLbl').textContent = cellSize;
  reset();
});

buildRule(110);
seed('single');
</script>
</body>
</html>
