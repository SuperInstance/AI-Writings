<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substrate Stocks — Poisson price process</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#131a2b;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--accent3:#7c5cff;--warn:#ff6b6b;--amber:#ffb84d;--mono:'SF Mono',monospace;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:1.5rem;min-height:100vh;background:radial-gradient(ellipse at center,#0a1a0a 0%,#06080f 60%)}
header{max-width:1200px;margin:0 auto 1.5rem;text-align:center}
h1{color:var(--accent);font-size:1.8rem;margin:0 0 .3rem}
.tagline{color:var(--dim);font-size:.95rem}
main{max-width:1200px;margin:0 auto}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1rem}
canvas{display:block;background:#000;border-radius:6px;width:100%;height:400px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem;align-items:center;margin-bottom:1rem}
button{background:var(--accent);color:#000;border:none;padding:.5rem 1rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:.85rem}
button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
label{color:var(--dim);font-family:var(--mono);font-size:.75rem;display:flex;align-items:center;gap:.3rem}
input[type=number], input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.3rem .5rem;font-family:var(--mono);font-size:.85rem;width:80px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:var(--mono);font-size:.8rem}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.5rem}
.stat .label{color:var(--dim);font-size:.7rem;text-transform:uppercase;letter-spacing:1px}
.stat .value{color:var(--accent);font-size:1.1rem;font-weight:bold;margin-top:.2rem}
.stat .value.up{color:var(--accent)}
.stat .value.down{color:var(--warn)}
.trades{margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:var(--mono);font-size:.78rem;color:var(--text2);max-height:200px;overflow-y:auto}
.trades .row{padding:.3rem;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:.5rem}
.trades .buy{color:var(--accent)}
.trades .sell{color:var(--warn)}
footer{max-width:1200px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>📈 Substrate Stocks</h1>
<p class="tagline">A Poisson-process stock market. Each tick = Poisson(λ) jump + Box-Muller volatility. Trading bot uses cosine-similarity to the past.</p>
</header>

<main>
<div class="chart"><canvas id="chart"></canvas></div>
<div class="controls">
<button onclick="start()">▶ Start</button>
<button class="secondary" onclick="pause()">⏸ Pause</button>
<button class="secondary" onclick="reset()">↻ Reset</button>
<button class="secondary" onclick="buy()">📈 Buy</button>
<button class="secondary" onclick="sell()">📉 Sell</button>
<label>μ: <input type="number" id="mu" value="0.001" step="0.001"></label>
<label>σ: <input type="number" id="sigma" value="0.02" step="0.005"></label>
<label>λ: <input type="number" id="lambda" value="0.1" step="0.05"></label>
<label>Seed: <input type="text" id="seed" value="xochitl" style="width:100px"></label>
</div>
<div class="stats">
<div class="stat"><div class="label">Price</div><div class="value" id="sPrice">100.00</div></div>
<div class="stat"><div class="label">Cash</div><div class="value" id="sCash">10000</div></div>
<div class="stat"><div class="label">Shares</div><div class="value" id="sShares">0</div></div>
<div class="stat"><div class="label">Net</div><div class="value" id="sNet">10000</div></div>
<div class="stat"><div class="label">Tick</div><div class="value" id="sTick">0</div></div>
<div class="stat"><div class="label">Poisson</div><div class="value" id="sPoi">—</div></div>
<div class="stat"><div class="label">Gaussian</div><div class="value" id="sGau">—</div></div>
<div class="stat"><div class="label">State hash</div><div class="value" id="sHash" style="font-size:.7rem;word-break:break-all">—</div></div>
</div>
<div class="trades" id="trades"></div>
</main>

<footer>📈 substrate stocks · <a href="../math-layer.html">math-layer</a></footer>

<script>
class Xoshiro256 {
  constructor(seed) {
    if (typeof seed === 'string') {
      const h = fnv1a64(new TextEncoder().encode(seed));
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, h + BigInt(i) * 0x9e3779b97f4a7c15n);
    } else {
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, BigInt(seed + i * 0x9e3779b97f4a7c15));
    }
  }
  next() {
    const s = this.state;
    const result = BigInt.asUintN(64, (BigInt.asUintN(64, s[1] * 5n) << 7n | BigInt.asUintN(64, s[1] * 5n) >> 57n) * 9n);
    const t = s[1] << 17n;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t;
    s[3] = BigInt.asUintN(64, (s[3] << 45n | s[3] >> 19n));
    return result;
  }
  float() { return Number(this.next() & 0xffffffffn) / (1 << 32); }
}
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < bytes.length; i++) h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * 0x100000001b3n);
  return h;
}
function gaussian(rng) {
  let u1 = 0, u2 = 0;
  while (u1 === 0) u1 = rng.float();
  while (u2 === 0) u2 = rng.float();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}
function poisson(rng, lambda) {
  // Knuth's algorithm
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do {
    k++;
    p *= rng.float();
  } while (p > L);
  return k - 1;
}

let rng = new Xoshiro256('stocks-' + Date.now());
let price = 100, prevPrice = 100;
let cash = 10000, shares = 0;
let history = [];
let tick = 0;
let isRunning = false;
let interval = null;

function step() {
  tick++;
  prevPrice = price;
  const mu = parseFloat(document.getElementById('mu').value);
  const sigma = parseFloat(document.getElementById('sigma').value);
  const lambda = parseFloat(document.getElementById('lambda').value);
  // Poisson jump count
  const jumps = poisson(rng, lambda);
  // Gaussian drift per jump
  const g = gaussian(rng);
  const change = mu + sigma * g * (1 + jumps);
  price = Math.max(1, price * (1 + change));
  history.push(price);
  if (history.length > 200) history.shift();
  render();
}

function render() {
  const c = document.getElementById('chart');
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, c.width, c.height);
  if (history.length < 2) return;
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  // Line
  ctx.strokeStyle = price > prevPrice ? '#00ff9d' : '#ff6b6b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < history.length; i++) {
    const x = (i / (history.length - 1)) * c.width;
    const y = c.height - ((history[i] - min) / range) * c.height;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  // Reference line at start price
  ctx.strokeStyle = '#5a6580';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  const startY = c.height - ((100 - min) / range) * c.height;
  ctx.moveTo(0, startY); ctx.lineTo(c.width, startY);
  ctx.stroke();
  ctx.setLineDash([]);
  // Stats
  const net = cash + shares * price;
  document.getElementById('sPrice').textContent = price.toFixed(2);
  document.getElementById('sPrice').className = 'value ' + (price > prevPrice ? 'up' : (price < prevPrice ? 'down' : ''));
  document.getElementById('sCash').textContent = cash.toFixed(0);
  document.getElementById('sShares').textContent = shares;
  document.getElementById('sNet').textContent = net.toFixed(0);
  document.getElementById('sTick').textContent = tick;
  document.getElementById('sPoi').textContent = '—';
  document.getElementById('sGau').textContent = '—';
  document.getElementById('sHash').textContent = '0x' + fnv1a64(new TextEncoder().encode(`${tick}|${price.toFixed(2)}|${net.toFixed(0)}`)).toString(16).padStart(16, '0');
}

function buy() {
  if (cash < price) return;
  const amount = Math.floor(cash / price);
  if (amount > 0) {
    shares += amount;
    cash -= amount * price;
    log('buy', amount, price);
    render();
  }
}
function sell() {
  if (shares === 0) return;
  const amount = Math.floor(shares * 0.5);
  if (amount > 0) {
    cash += amount * price;
    shares -= amount;
    log('sell', amount, price);
    render();
  }
}
function log(type, amount, p) {
  const el = document.getElementById('trades');
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `<span>#${tick}</span><span class="${type}">${type} ×${amount}</span><span>@ $${p.toFixed(2)}</span><span>$${(amount * p).toFixed(0)}</span>`;
  el.insertBefore(div, el.firstChild);
  while (el.children.length > 30) el.removeChild(el.lastChild);
}

function start() {
  if (isRunning) return;
  isRunning = true;
  interval = setInterval(step, 200);
}
function pause() { isRunning = false; clearInterval(interval); }
function reset() {
  pause();
  rng = new Xoshiro256(document.getElementById('seed').value + '-' + Date.now());
  price = 100; prevPrice = 100;
  cash = 10000; shares = 0;
  history = []; tick = 0;
  render();
}

document.getElementById('seed').addEventListener('change', reset);

render();
</script>
</body>
</html>
