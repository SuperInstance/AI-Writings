[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decide"
version = "0.1.0"
description = "Thin Python client for the JEV (TypeSafe System One) decision model. Three primitives: Choice, Score, Noul. Schema-bounded, can't hallucinate."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Casey"},
]
keywords = ["jev", "typesafe", "decision", "schema-bounded", "quilt", "cellular-substrate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://ai-writings.pages.dev/lab/jev-quantum/"
Source = "https://github.com/SuperInstance/AI-Writings/tree/master/lab/jev-quantum"
"Bug Tracker" = "https://github.com/SuperInstance/AI-Writings/issues"

[tool.setuptools.packages.find]
where = ["src"]
