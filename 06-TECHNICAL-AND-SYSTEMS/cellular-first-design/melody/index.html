<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Substrate Melody — chord progression</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#131a2b;--border:#1a2238;--text:#e8ecf4;--dim:#5a6580;--accent:#00ff9d;--accent2:#00d4ff;--accent3:#7c5cff;--amber:#ffb84d;--pink:#ff80c0;--mono:'SF Mono',monospace;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:1.5rem;min-height:100vh;background:radial-gradient(ellipse at top,#1a0a2a 0%,#06080f 60%)}
header{max-width:1100px;margin:0 auto 1.5rem;text-align:center}
h1{color:var(--accent);font-size:1.8rem;margin:0 0 .3rem}
.tagline{color:var(--dim);font-size:.95rem}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:1.5rem}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{display:block;background:#000;border:1px solid var(--accent);border-radius:6px;width:100%;height:300px;margin-bottom:1rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;height:fit-content}
button{display:block;width:100%;background:var(--accent);color:#000;border:none;padding:.6rem;border-radius:6px;cursor:pointer;font-weight:bold;font-size:.85rem;margin-bottom:.4rem}
button:hover{background:#3dffb7}
button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
label{color:var(--dim);font-family:var(--mono);font-size:.75rem;display:flex;align-items:center;gap:.3rem;margin:.3rem 0}
input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:.4rem;font-family:var(--mono);font-size:.85rem;margin-bottom:.5rem}
input[type=range]{flex:1}
.stats{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:.7rem;margin-top:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--text2)}
.stats div{margin-bottom:.1rem}
.stats .v{color:var(--accent);font-weight:bold}
.chord-list{margin-top:1rem;font-family:var(--mono);font-size:.78rem}
.chord{padding:.5rem;border-bottom:1px solid var(--border);color:var(--text2)}
.chord.active{color:var(--accent);background:rgba(0,255,157,0.05);border-left:2px solid var(--accent);padding-left:.5rem}
.chord .name{font-weight:bold}
.chord .freq{color:var(--dim);font-size:.7rem}
footer{max-width:1100px;margin:2rem auto 0;padding:1rem;text-align:center;color:var(--dim);font-family:var(--mono);font-size:.75rem;border-top:1px solid var(--border)}
footer a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>🎼 Substrate Melody</h1>
<p class="tagline">Chord progression generator. Each chord = xoshiro256** + Box-Muller modulation.</p>
</header>

<main>
<canvas id="viz"></canvas>
<aside class="panel">
<label>Seed: <input type="text" id="seed" value="the fleet radio"></label>
<button onclick="generate()">🎼 Generate progression</button>
<button class="secondary" onclick="play()">▶ Play</button>
<button class="secondary" onclick="stop()">⏹ Stop</button>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Settings</h3>
<label>BPM: <input type="range" id="bpm" min="40" max="200" value="80"> <span id="bpmLbl">80</span></label>
<label>Vol: <input type="range" id="vol" min="0" max="100" value="40"> <span id="volLbl">40</span></label>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Stats</h3>
<div class="stats">
<div>Chords: <span class="v" id="sChords">0</span></div>
<div>Total notes: <span class="v" id="sNotes">0</span></div>
<div>State hash: <span class="v" id="sHash" style="font-size:.6rem;word-break:break-all">—</span></div>
</div>
<h3 style="color:var(--text);font-size:1rem;margin:1rem 0 .3rem">Progression</h3>
<div class="chord-list" id="chordList"></div>
</aside>
</main>

<footer>🎼 substrate melody · <a href="../math-layer.html">math-layer</a></footer>

<script>
class Xoshiro256 {
  constructor(seed) {
    if (typeof seed === 'string') {
      const h = fnv1a64(new TextEncoder().encode(seed));
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, h + BigInt(i) * 0x9e3779b97f4a7c15n);
    } else {
      this.state = new BigUint64Array(4);
      for (let i = 0; i < 4; i++) this.state[i] = BigInt.asUintN(64, BigInt(seed + i * 0x9e3779b97f4a7c15));
    }
  }
  next() {
    const s = this.state;
    const result = BigInt.asUintN(64, (BigInt.asUintN(64, s[1] * 5n) << 7n | BigInt.asUintN(64, s[1] * 5n) >> 57n) * 9n);
    const t = s[1] << 17n;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t;
    s[3] = BigInt.asUintN(64, (s[3] << 45n | s[3] >> 19n));
    return result;
  }
  float() { return Number(this.next() & 0xffffffffn) / (1 << 32); }
  intRange(min, max) { return Math.floor(this.float() * (max - min)) + min; }
}
function fnv1a64(bytes) {
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < bytes.length; i++) h = BigInt.asUintN(64, (h ^ BigInt(bytes[i])) * 0x100000001b3n);
  return h;
}
function gaussian(rng) {
  let u1 = 0, u2 = 0;
  while (u1 === 0) u1 = rng.float();
  while (u2 === 0) u2 = rng.float();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const CHORD_TYPES = [
  { name: 'maj',  intervals: [0, 4, 7] },
  { name: 'min',  intervals: [0, 3, 7] },
  { name: 'dim',  intervals: [0, 3, 6] },
  { name: 'aug',  intervals: [0, 4, 8] },
  { name: 'maj7', intervals: [0, 4, 7, 11] },
  { name: 'min7', intervals: [0, 3, 7, 10] },
  { name: 'sus4', intervals: [0, 5, 7] },
];

let audioCtx = null, masterGain = null;
let chords = [];
let rng = null;
let isPlaying = false;
let playInterval = null;
let activeIdx = -1;
let canvas, ctx;

function generate() {
  const seed = document.getElementById('seed').value;
  rng = new Xoshiro256(seed);
  chords = [];
  const count = 8;
  for (let i = 0; i < count; i++) {
    // Choose key (root note 0-11) and chord type
    const root = rng.intRange(0, 12);
    const type = CHORD_TYPES[rng.intRange(0, CHORD_TYPES.length)];
    // Box-Muller modulates the chord's character
    const g = gaussian(rng);
    // Slight voicing: invert if g > 0.5
    const inverted = g > 0.5;
    const notes = type.intervals.map(i => root + i);
    if (inverted) {
      const first = notes.shift();
      notes.push(first + 12);
    }
    const freq = 220 * Math.pow(2, root / 12);
    chords.push({ root, type, notes, freq, name: `${NOTE_NAMES[root]}${type.name}` });
  }
  // Render list
  const list = document.getElementById('chordList');
  list.innerHTML = '';
  chords.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'chord';
    div.id = `chord-${i}`;
    div.innerHTML = `<span class="name">${c.name}</span> — ${c.notes.map(n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) + 3)).join(', ')}<br><span class="freq">${c.freq.toFixed(1)} Hz (${c.notes.map(n => (c.freq * Math.pow(2, n / 12)).toFixed(1) + 'Hz').join(', ')})</span>`;
    list.appendChild(div);
  });
  document.getElementById('sChords').textContent = chords.length;
  document.getElementById('sNotes').textContent = chords.reduce((a, c) => a + c.notes.length, 0);
  document.getElementById('sHash').textContent = '0x' + fnv1a64(new TextEncoder().encode(seed)).toString(16).padStart(16, '0');
  drawViz();
}

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseInt(document.getElementById('vol').value) / 100;
    masterGain.connect(audioCtx.destination);
  }
}

function playChord(c, duration = 1.5) {
  ensureAudio();
  for (const n of c.notes) {
    const f = c.freq * Math.pow(2, n / 12);
    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    env.gain.setValueAtTime(0, audioCtx.currentTime);
    env.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
    env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(env); env.connect(masterGain);
    osc.start();
    osc.stop(audioCtx.currentTime + duration + 0.01);
  }
}

function play() {
  if (chords.length === 0) generate();
  isPlaying = true;
  let idx = 0;
  const tick = () => {
    if (!isPlaying) return;
    activeIdx = idx;
    document.querySelectorAll('.chord').forEach((el, i) => el.classList.toggle('active', i === idx));
    playChord(chords[idx]);
    idx = (idx + 1) % chords.length;
  };
  tick();
  const interval = (60000 / parseInt(document.getElementById('bpm').value)) * 2; // 2 beats per chord
  playInterval = setInterval(tick, interval);
}

function stop() {
  isPlaying = false;
  clearInterval(playInterval);
  document.querySelectorAll('.chord').forEach(el => el.classList.remove('active'));
  activeIdx = -1;
}

function drawViz() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < chords.length; i++) {
    const c = chords[i];
    const x = (i / chords.length) * canvas.width;
    const next = (i + 1) / chords.length * canvas.width;
    const w = next - x - 4;
    for (let j = 0; j < c.notes.length; j++) {
      const n = c.notes[j];
      const y = canvas.height - (n / 24) * canvas.height - 5;
      const hue = (c.root * 30 + n * 8) % 360;
      ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
      ctx.fillRect(x, y, w, 12);
    }
    if (i === activeIdx) {
      ctx.strokeStyle = '#00ff9d';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 1, 0, w + 2, canvas.height);
    }
  }
}

document.getElementById('bpm').addEventListener('input', e => {
  document.getElementById('bpmLbl').textContent = e.target.value;
  if (isPlaying) { stop(); play(); }
});
document.getElementById('vol').addEventListener('input', e => {
  document.getElementById('volLbl').textContent = e.target.value;
  if (masterGain) masterGain.gain.value = parseInt(e.target.value) / 100;
});

canvas = document.getElementById('viz');
ctx = canvas.getContext('2d');
generate();
</script>
</body>
</html>
