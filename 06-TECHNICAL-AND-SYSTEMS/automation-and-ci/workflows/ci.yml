name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  writings-gate:
    name: Writings gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The corpus is prose. The previous job (pip install -e . 2>/dev/null)
      # could not work at all -- the repo has no packaging metadata -- and it
      # hid its own error text. Two legs now:
      #
      # LEG 1 (hard gate): every .md non-empty. Allowlist-aware via
      # .writings-gate-allowlist (18 intentional 0-1 byte holds registered
      # 2026-09-30, the gate's first honest firing). A NEW empty file fails.
      #
      # LEG 2 (reporting, not gating -- see name): internal relative links.
      # First full run found 341 broken, a mix of site-absolute paths
      # (/fleet-radio/..., Pages URLs), percent-encoded names, and genuine
      # dangling files. Triaged ratchet to be committed before this leg
      # flips to gating -- same one-line flip as polln#64's suite leg.
      - name: leg-1 every .md is non-empty (allowlist-aware, HARD GATE)
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys
          allow = set()
          al = pathlib.Path('.writings-gate-allowlist')
          if al.exists():
              allow = {l.strip() for l in al.read_text().splitlines()
                       if l.strip() and not l.strip().startswith('#')}
          bad = []
          for p in pathlib.Path('.').rglob('*.md'):
              rel = str(p)
              if rel in allow:
                  continue
              if p.stat().st_size == 0 or len(p.read_text(errors='ignore').strip()) < 20:
                  bad.append(rel)
          for x in bad: print(f"EMPTY/TRUNCATED: {x}")
          print(f"empty/truncated: {len(bad)} (allowlist holds: {len(allow)})")
          sys.exit(1 if bad else 0)
          PYEOF

      - name: leg-2 internal relative links (REPORTING, not gating — ratchet pending)
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys, urllib.parse
          root = pathlib.Path('.')
          md = list(root.rglob('*.md'))
          broken = []
          for p in md:
              text = p.read_text(errors='ignore')
              for m in re.finditer(r'\]\((?!https?://|#|mailto:)([^)#]+?)(?:#[^)]*)?\)', text):
                  raw = m.group(1).strip()
                  if raw.startswith('/'):
                      continue  # site-absolute: a Pages/web path, not a repo file
                  if ': ' in raw or ':' in raw and '/' not in raw:
                      continue  # inline code like (input: List[T]), not a path
                  target = (p.parent / pathlib.Path(urllib.parse.unquote(raw))).resolve()
                  if not target.exists():
                      broken.append(f"{p} -> {raw}")
          for b in broken[:40]: print(f"BROKEN LINK: {b}")
          print(f"checked {len(md)} files, {len(broken)} broken internal links (reporting)")
          PYEOF
