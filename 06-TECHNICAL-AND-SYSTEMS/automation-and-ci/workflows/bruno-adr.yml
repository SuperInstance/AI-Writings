# bruno-adr.yml — run Bruno the Architect's ADR generator with vault-backed providers.
#
# WHY THIS EXISTS
# ---------------
# bruno_adr.py calls z.ai (glm-4.5) with ZAI_TOKEN. That key lives on the fleet
# host, not in the sandbox, and the credential gap has been hit for 20+
# consecutive sessions upstream. The fleet's own answer is the SuperInstance
# vault (https://superinstance-vault.casey-digennaro.workers.dev/proxy), which
# holds an LLM credential and is reachable from inside GitHub Actions via a
# GitHub OIDC token. This workflow mints that OIDC token and reroutes the
# provider call through the vault.
#
# WHAT STAYS UNTOUCHED
# --------------------
# bruno_adr.py's own logic: topic selection, prompt construction, ADR file
# naming, the header/footer format, and the witness.log append. Only the
# transport changes, exactly as snowball-rsi-gan.yml does for snowball-scout.
#
# The script's module-level paths are hardcoded to the fleet-host layout
# (/workspace/repos/ai-writings), so they are repointed at the runner's
# checkout before the script is used -- same treatment snowball-rsi-gan.yml
# gives snowball_writer.py.
#
# HONESTY NOTE (2026-10-24)
# -------------------------
# The vault shim swallows provider errors and returns None. bruno_adr.py's
# run_once() then writes nothing and still exits 0 -- a green job that produced
# no ADR. This workflow therefore does NOT trust the exit code: it asserts that
# a new ADR file actually appeared, and fails the job if it did not. The
# snowball-rsi-gan.yml workflow has this bug today (it commits a witness row
# and reports success while all three providers return 403).
#
# CURRENT STATE: the vault refuses this repo. The call returns
#   403 {"error":"Not authorized","repo":"SuperInstance/AI-Writings", ...}
# The OIDC token is fine -- the vault parses it and echoes repo/workflow/branch
# back -- so this is an allowlist decision. VAULT.md says a repo must be
# registered by opening an issue titled "Register"; that issue is #94. Until
# the coordinator adds this repo, the working route is to generate in
# SuperInstance/zero-msg-test (registered) and publish the artifact here, which
# is how ADR-0015 was written on 2026-10-24. See
# research/snowball-rsi-gan-20261024.md for the same diagnosis.

name: bruno-adr

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional ADR topic number override (0007-0018). Empty = Bruno picks at random.'
        required: false
        default: ''
      dry_run:
        description: 'Generate the ADR but do not commit it.'
        required: false
        default: 'false'

permissions:
  id-token: write
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV

      - name: Probe the vault directly (shows the real upstream status)
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          VAULT = "https://superinstance-vault.casey-digennaro.workers.dev/proxy"
          body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": "llm", "action": "complete",
                  "params": {"model": "MiniMax-M2.5",
                             "messages": [{"role": "user", "content": "Reply with exactly: PONG"}],
                             "max_tokens": 20}}
          req = urllib.request.Request(VAULT, data=json.dumps(body).encode(), method="POST",
                                       headers={"Content-Type": "application/json",
                                                "User-Agent": "purplepincher-zero/1.0"})
          try:
              r = urllib.request.urlopen(req, timeout=120)
              print("VAULT STATUS:", r.status)
              print("VAULT BODY:", r.read().decode()[:600])
          except Exception as e:
              body_txt = ""
              try:
                  body_txt = e.read().decode()[:600]
              except Exception:
                  pass
              print("VAULT ERROR:", type(e).__name__, str(e)[:200])
              print("VAULT ERROR BODY:", body_txt)
              code = getattr(e, "code", None)
              if code == 401:
                  print("DIAGNOSIS: OIDC_REJECTED - the vault could not verify the runner's OIDC token.")
              elif code == 403 and "Not authorized" in body_txt:
                  print("DIAGNOSIS: REPO_NOT_REGISTERED - the vault verified OIDC and refused on its allowlist.")
                  print("REMEDIATION: open an issue titled 'Register' in this repo (see VAULT.md).")
                  print("Until then, generate in SuperInstance/zero-msg-test (registered) and")
                  print("publish the artifact here. See research/snowball-rsi-gan-20261024.md.")
              else:
                  print("DIAGNOSIS: UPSTREAM_PROVIDER_REFUSED - OIDC passed; the vault's model provider refused.")
          PY

      - name: Run Bruno (write one ADR)
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
          TOPIC_OVERRIDE: ${{ inputs.topic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os, sys, pathlib, importlib.util

          ROOT = pathlib.Path.cwd()
          BOT = ROOT / "bots" / "bruno-architect"

          sys.path.insert(0, str(BOT))
          import bruno_adr as ba

          # Repoint the hardcoded fleet-host paths at this runner's checkout.
          ba.ADRS_DIR = BOT / "adrs"
          ba.WITNESS_PATH = BOT / "witness.log"

          # Route the provider call through the vault (holds the LLM credential).
          spec = importlib.util.spec_from_file_location(
              "vault_provider_shim", ROOT / "bots" / "snowball-scout" / "vault_provider_shim.py"
          )
          shim = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(shim)

          # Do not let the shim swallow the failure: wrap it so a provider
          # error is visible in the log rather than becoming a silent None.
          def call_zai(prompt, max_tokens=1500):
              out = shim.call_zai(prompt, max_tokens=max_tokens)
              if not out:
                  print("PROVIDER UNAVAILABLE: the vault returned no content.")
                  print("The vault is reachable and OIDC is valid, but it refused on its")
                  print("allowlist or its upstream provider refused. See the probe step above.")
                  return None
              return out
          ba.call_zai = call_zai

          # Optional topic override so a dispatch can name the ADR it wants.
          override = os.environ.get("TOPIC_OVERRIDE", "").strip()
          if override:
              override = override.zfill(4)
              match = [t for t in ba.ADR_TOPICS if t[0] == override]
              if not match:
                  raise SystemExit("unknown topic %s; known: %s" % (override, [t[0] for t in ba.ADR_TOPICS]))
              ba.random.choice = lambda seq, _m=match: _m[0]

          ba.run_once()
          PY

      - name: Assert an ADR was actually written
        run: |
          set -uo pipefail
          echo "--- adrs/ ---"
          ls -la bots/bruno-architect/adrs/
          echo
          echo "--- witness.log tail ---"
          tail -3 bots/bruno-architect/witness.log
          echo
          if [ -z "$(git status --porcelain bots/bruno-architect/adrs/)" ]; then
            echo "ASSERTION FAILED: no new or modified ADR file in bots/bruno-architect/adrs/"
            echo "The generator produced no ADR. The most likely cause is that this repo is"
            echo "not on the vault allowlist, so the provider call is refused with 403."
            echo "Register this repo (issue titled 'Register'), or generate in"
            echo "SuperInstance/zero-msg-test and publish the artifact here."
            exit 1
          fi
          echo "OK: an ADR file is present and changed."

      - name: Commit the ADR
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "bruno-architect"
          git config user.email "bruno@superinstance.dev"
          git add bots/bruno-architect/adrs/ bots/bruno-architect/witness.log || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "bruno-architect: ADR via vault-backed provider"
          git push origin HEAD:bot/bruno-adr-vault
