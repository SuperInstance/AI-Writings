name: probe-aiw-vault

on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC token for vault
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> $GITHUB_ENV
      - name: Probe vault from AI-Writings
        env:
          OIDC_TOKEN: ${{ env.OIDC_TOKEN }}
          VAULT_URL: https://superinstance-vault.casey-digennaro.workers.dev
        run: |
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.error
          body = {"oidc_token": os.environ["OIDC_TOKEN"], "service": "llm", "action": "complete",
                  "params": {"model": "MiniMax-M2.5", "messages": [{"role":"user","content":"Reply exactly: PROBE-OK"}], "max_tokens": 20}}
          req = urllib.request.Request(os.environ["VAULT_URL"]+"/proxy", data=json.dumps(body).encode(),
              headers={"Content-Type":"application/json","User-Agent":"purplepincher-zero/1.0"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  print("VAULT_LLM -> OK", r.read().decode()[:500])
          except urllib.error.HTTPError as e:
              print("VAULT_LLM -> HTTP", e.code, e.read().decode(errors="replace")[:300])
          except Exception as e:
              print("VAULT_LLM -> ERR", type(e).__name__, str(e)[:200])
          PY
