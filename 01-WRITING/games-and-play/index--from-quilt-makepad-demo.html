<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quilt × Makepad — Live Demo</title>
<style>
  body { 
    background: #0a0a14; color: #e8e0d0; font-family: 'Georgia', serif;
    margin: 0; padding: 2rem;
  }
  h1 { color: #e8b840; }
  #canvas {
    position: relative;
    width: 800px; height: 500px;
    background: #1a1a2a;
    border: 2px solid #2a2a3a;
    border-radius: 8px;
    overflow: hidden;
  }
  .quilt-cell {
    position: absolute;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.3);
    font-family: monospace;
    font-size: 0.8em;
    padding: 8px;
    color: white;
    text-shadow: 1px 1px 1px black;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: pre;
  }
  .quilt-cell:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(232,184,64,0.5);
  }
  #witness-log {
    background: #0d1117;
    border: 1px solid #2a2a3a;
    border-radius: 4px;
    padding: 1rem;
    font-family: monospace;
    font-size: 0.85em;
    height: 200px;
    overflow-y: auto;
    margin-top: 1rem;
  }
  .witness { margin: 2px 0; padding: 2px 4px; }
  .witness.BIND { color: #44cc88; }
  .witness.LINK { color: #88aaff; }
  .witness.EFFECT { color: #ff8080; }
  .witness.TICK { color: #aa88ff; }
  .controls { margin: 1rem 0; }
  button {
    background: #e8b840; color: #000; border: none;
    padding: 0.6rem 1rem; border-radius: 4px;
    cursor: pointer; font-weight: bold; font-family: inherit;
    margin-right: 0.5rem;
  }
  button:hover { filter: brightness(1.1); }
  .secondary { background: #2a2a3a; color: #e8e0d0; }
  #status {
    background: #1a1a2a; padding: 0.5rem 1rem; border-radius: 4px;
    font-family: monospace; font-size: 0.85em;
    display: inline-block; margin-left: 1rem;
  }
</style>
</head>
<body>
<h1>Quilt × Makepad — Live Cell Rendering</h1>
<p>Click cells to bind. Click "TICK All" to advance the lattice. Watch the witness log fill.</p>

<div class="controls">
  <button onclick="lattice.tickAll(); refreshAll();">⚡ TICK All</button>
  <button class="secondary" onclick="randomBind();">🔗 Random BIND</button>
  <button class="secondary" onclick="exportWits();">💾 Export Witness Log</button>
  <span id="status">tick: 0 | cells: 0 | witnesses: 0 | root: 0x0</span>
</div>

<div id="canvas"></div>

<div id="witness-log"></div>

<script type="module">
import { QuiltCell, QuiltLattice } from './js/quilt-cell.js';

window.lattice = new QuiltLattice();
const cellIds = ['cell-1', 'cell-2', 'cell-3', 'cell-4', 'cell-5', 'cell-6', 'cell-7', 'cell-8', 'cell-9'];
const positions = [
  [40, 40], [180, 40], [320, 40],
  [40, 180], [180, 180], [320, 180],
  [40, 320], [180, 320], [320, 320]
];

cellIds.forEach((id, i) => {
  const cell = new QuiltCell(id, {
    position: positions[i],
    size: [120, 120],
    op: 'BIND',
    data: `cell at (${positions[i][0]}, ${positions[i][1]})`
  });
  lattice.add(cell);
  cell.render(document.getElementById('canvas'));
});

// Set up click handler
document.getElementById('canvas').addEventListener('click', (e) => {
  const cellDiv = e.target.closest('.quilt-cell');
  if (!cellDiv) return;
  const cellId = cellDiv.dataset.cellId;
  // Bind to a random neighbor
  const neighbors = [...lattice.cells.keys()].filter(id => id !== cellId);
  const target = neighbors[Math.floor(Math.random() * neighbors.length)];
  const w = lattice.bind(cellId, target, 'manual click');
  logWitness(w);
  refreshAll();
});

window.refreshAll = function() {
  lattice.update();
  document.getElementById('status').textContent = 
    `tick: ${lattice.tick} | cells: ${lattice.cells.size} | witnesses: ${lattice.witnesses.length} | root: ${lattice.rootHash().slice(0, 16)}...`;
};

window.randomBind = function() {
  const ids = [...lattice.cells.keys()];
  const a = ids[Math.floor(Math.random() * ids.length)];
  const b = ids[Math.floor(Math.random() * ids.length)];
  if (a !== b) {
    const w = lattice.bind(a, b, 'random');
    logWitness(w);
    refreshAll();
  }
};

window.exportWits = function() {
  const data = JSON.stringify(lattice.witnesses, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `quilt-witnesses-${Date.now()}.json`;
  a.click();
};

window.logWitness = function(w) {
  const log = document.getElementById('witness-log');
  const line = document.createElement('div');
  line.className = `witness ${w.op}`;
  line.textContent = `[t=${lattice.tick}] ${w.op} ${w.cellId}${w.target ? '→' + w.target : ''} (w=${w.witness})`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  // Keep log under 100 entries
  while (log.children.length > 100) log.removeChild(log.firstChild);
};

// Initial render
refreshAll();
</script>

</body>
</html>
